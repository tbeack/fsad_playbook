# fsd:add-task — project conventions
#
# The skill resolves the current working directory against `match_paths` for
# each project (longest match wins; the cwd may be a descendant of a match
# path). The matched entry drives prefix, numbering, todo-file location, task
# file naming, and todo-entry formatting.
#
# Template tokens (resolved at runtime):
#   {ID}            - full identifier, e.g. "CBP-031" or "KHB-Todo-0010"
#   {title}         - one-line task title
#   {nnn}           - zero-padded number (digits = number_digits)
#   {prefix_lower}  - prefix lowercased for filenames; overridden by
#                     `prefix_in_filename` if present
#
# Insertion rules:
#   insert_before_section  - put the new bullet immediately before this heading
#   insert_under_section   - put the new bullet as the LAST bullet under this
#                            heading (and before the next heading, if any)
#   neither                - append to the end of the top-level list
#
# `use_full_template: true`  - prompt for Source/Summary/Assessment/Plan/AC
#                              and write a task-detail file
# `use_full_template: false` - just add the bullet to the todo file
#
# To register a new project, add an entry under `projects:` and (optionally)
# let the skill do it interactively the first time you invoke it from an
# unknown directory.

projects:
  fsad_playbook:
    match_paths:
      - ~/repo/fsad_playbook
    prefix: CBP
    number_digits: 3
    todo_file: markdown/to do/todo.md
    task_dir: markdown/to do
    task_filename_template: task-cbp-{nnn}.md
    todo_entry_template: "- [ ] `{ID}` {title} → [task-cbp-{nnn}.md](task-cbp-{nnn}.md)"
    insert_before_section: "## Bug Details"
    use_full_template: true
    changelog_file: CHANGELOG.md
    version_scheme: semver   # vNN.NN.N (e.g. v2.36.0, v2.37.1)
    version_files:
      - fsad-playbook.html    # <title> tag
      - README.md             # version table row
    notes: |
      Em-dash heading style. CBP-### with leading zeros. Reference task-cbp-030.md
      for formatting cues. Version is semver (v2.36.0, v2.37.1…) — bump by 1 each release.
      Keep fsad-playbook.html title tag, README version table, and CHANGELOG aligned.

  fsad_training:
    match_paths:
      - ~/repo/fsad_training
    prefix: FSD_Train
    prefix_in_filename: fsd_train
    number_digits: 3
    todo_file: planning/to do/todo.md
    task_dir: planning/to do
    task_filename_template: task-fsd_train-{nnn}.md
    todo_entry_template: "- [ ] `{ID}` {title} → [task-fsd_train-{nnn}.md](task-fsd_train-{nnn}.md)"
    use_full_template: true
    changelog_file: CHANGELOG.md
    version_scheme: semver
    version_files:
      - package.json
    notes: |
      Identifier preserves underscore + mixed case (FSD_Train); filename uses
      lowercase. Completed tasks are git-mv'd into ../completed/ at ship time.
      Semver in package.json; CHANGELOG.md at project root.

# Fallback when no project matches. Always confirm with the user before using
# these defaults; offer to register the project so future runs are automatic.
default:
  number_digits: 3
  todo_file: planning/to do/todo.md
  task_dir: planning/to do
  task_filename_template: task-{prefix_lower}-{nnn}.md
  todo_entry_template: "- [ ] `{ID}` — {title} → [task-{prefix_lower}-{nnn}.md](task-{prefix_lower}-{nnn}.md)"
  insert_under_section: "## Backlog"
  use_full_template: true
